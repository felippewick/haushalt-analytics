[package]
name = "uebrig"
version = "0.1.0"
description = "Local household expense analytics (DKB / Trade Republic)"
authors = ["uebrig"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.5.1"
encoding_rs = "0.8"
# Bundled local LLM (GGUF). Metal is auto-enabled on Apple Silicon via
# llama-cpp-2's target-specific deps. OpenMP disabled to avoid extra runtime deps.
llama-cpp-2 = { version = "0.1.154", default-features = false, features = ["common"] }
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
